spring.application.name=subscription-system
server.port=8080
spring.profiles.active=local

# ACTUATOR / METRICS
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true

# Expose /actuator/prometheus for Prometheus to scrape
management.prometheus.metrics.export.enabled=true
management.metrics.tags.application=${spring.application.name}

# TRACING (Micrometer Tracing + OpenTelemetry)
# Sample 100% of traces in dev; lower this in production (e.g. 0.1 = 10%)
management.tracing.sampling.probability=0.1

# LOGGING (structured JSON so Promtail/Loki can parse it easily)
logging.pattern.level=%5p [${spring.application.name},%X{traceId:-},%X{spanId:-}]
