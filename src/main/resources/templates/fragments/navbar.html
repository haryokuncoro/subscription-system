<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<nav class="navbar navbar-expand-lg bg-white border-bottom shadow-sm sticky-top"
     th:fragment="navbar(activeMenu)">

    <div class="container">

        <a class="navbar-brand fw-bold d-flex align-items-center"
           href="/plans">

            <i class="bi bi-credit-card-2-front-fill text-primary me-2"></i>

            Subscription System

        </a>

        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div class="collapse navbar-collapse"
             id="navbarNav">

            <ul class="navbar-nav mx-auto gap-2">
                <li class="nav-item">

                    <a class="nav-link rounded-pill px-3"
                       th:classappend="${activeMenu == 'users'} ? ' active fw-semibold bg-primary text-white' : 'text-dark'"
                       href="/users">

                        <i class="bi bi-box-seam me-1"></i>
                        Customers

                    </a>

                </li>

                <li class="nav-item">

                    <a class="nav-link rounded-pill px-3"
                       th:classappend="${activeMenu == 'plans'} ? ' active fw-semibold bg-primary text-white' : 'text-dark'"
                       href="/plans">

                        <i class="bi bi-box-seam me-1"></i>
                        Plans

                    </a>

                </li>

                <li class="nav-item">

                    <a class="nav-link rounded-pill px-3"
                       th:classappend="${activeMenu == 'subscriptions'} ? ' active fw-semibold bg-primary text-white' : 'text-dark'"
                       href="/subscriptions">

                        <i class="bi bi-arrow-repeat me-1"></i>
                        Subscriptions

                    </a>

                </li>

                <li class="nav-item">

                    <a class="nav-link rounded-pill px-3"
                       th:classappend="${activeMenu == 'invoices'} ? ' active fw-semibold bg-primary text-white' : 'text-dark'"
                       href="/invoices">

                        <i class="bi bi-receipt me-1"></i>
                        Invoices

                    </a>

                </li>

            </ul>

            <button class="btn btn-outline-danger"
                    onclick="logout()">

                <i class="bi bi-box-arrow-right me-1"></i>

                Logout

            </button>

        </div>

    </div>

</nav>

<script th:src="@{/js/api.js}"></script>

</body>
</html>
