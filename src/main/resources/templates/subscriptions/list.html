<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Subscriptions</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <link rel="stylesheet" href="/css/app.css">

</head>

<body>

<div th:replace="~{fragments/navbar :: navbar('subscriptions')}"></div>

<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-3">

        <h3>Subscriptions</h3>

        <button
                class="btn btn-primary"
                onclick="openCreateModal()">

            New Subscription

        </button>

    </div>

    <div class="card mb-4">

        <div class="card-body">

            <div class="row">

                <div class="col-md-3">

                    <label>User</label>

                    <select
                            id="filterUserId"
                            class="form-select">

                        <option value="">All Users</option>

                    </select>

                </div>

                <div class="col-md-3">

                    <label>Plan</label>

                    <select
                            id="filterPlanId"
                            class="form-select">

                        <option value="">All Plans</option>

                    </select>

                </div>

                <div class="col-md-2">

                    <label>Status</label>

                    <select
                            id="filterStatus"
                            class="form-select">

                        <option value="">All</option>
                        <option>ACTIVE</option>
                        <option>TRIALING</option>
                        <option>PAST_DUE</option>
                        <option>CANCELED</option>
                        <option>UNPAID</option>
                        <option>PAUSED</option>
                        <option>INCOMPLETE</option>

                    </select>

                </div>

                <div class="col-md-2">

                    <label>Page Size</label>

                    <select
                            id="pageSize"
                            class="form-select">

                        <option>10</option>
                        <option>25</option>
                        <option>50</option>

                    </select>

                </div>

                <div class="col-md-2 d-flex align-items-end">

                    <button
                            class="btn btn-primary w-100"
                            onclick="searchSubscriptions()">

                        Search

                    </button>

                </div>

            </div>

        </div>

    </div>

    <table class="table table-bordered table-hover">

        <thead class="table-light">

        <tr>

            <th>User</th>

            <th>Plan</th>

            <th>Status</th>

            <th>Current Period</th>

            <th>Cancel At Period End</th>

            <th>Stripe Subscription</th>

            <th width="180">
                Action
            </th>

        </tr>

        </thead>

        <tbody id="tableBody">

        </tbody>

    </table>

    <div class="d-flex justify-content-between align-items-center">

        <button
                class="btn btn-secondary"
                onclick="previousPage()">

            Previous

        </button>

        <span id="pageInfo">

        </span>

        <button
                class="btn btn-secondary"
                onclick="nextPage()">

            Next

        </button>

    </div>

</div>

<!-- Modal -->

<div
        class="modal fade"
        id="subscriptionModal"
        tabindex="-1">

    <div class="modal-dialog modal-lg">

        <div class="modal-content">

            <div class="modal-header">

                <h5 id="modalTitle">

                    Create Subscription

                </h5>

                <button
                        class="btn-close"
                        data-bs-dismiss="modal">
                </button>

            </div>

            <div class="modal-body">

                <input
                        id="id"
                        type="hidden">

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label>User</label>

                        <select
                                id="userId"
                                class="form-select">

                        </select>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label>Plan</label>

                        <select
                                id="planId"
                                class="form-select">

                        </select>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label>
                            Current Period Start
                        </label>

                        <input
                                id="currentPeriodStart"
                                type="datetime-local"
                                class="form-control">

                    </div>

                    <div class="col-md-6 mb-3">

                        <label>
                            Current Period End
                        </label>

                        <input
                                id="currentPeriodEnd"
                                type="datetime-local"
                                class="form-control">

                    </div>

                    <div class="col-md-6">

                        <div class="form-check mt-4">

                            <input
                                    id="cancelAtPeriodEnd"
                                    class="form-check-input"
                                    type="checkbox">

                            <label class="form-check-label">

                                Cancel At Period End

                            </label>

                        </div>

                    </div>

                </div>

            </div>

            <div class="modal-footer">

                <button
                        class="btn btn-secondary"
                        data-bs-dismiss="modal">

                    Close

                </button>

                <button
                        class="btn btn-primary"
                        onclick="save()">

                    Save

                </button>

            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script th:src="@{/js/api.js}"></script>

<script th:src="@{/js/subscriptions.js}"></script>

</body>

</html>
